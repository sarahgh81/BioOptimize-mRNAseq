[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biooptimize-mrnaseq"
version = "0.3.0"
description = "AI-assisted RNA-seq analysis pipeline (bulk + single-cell + multi-sample integration) for BioOptimize AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sarah Ghasemi", email = "sarahghasemi@icloud.com"}
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
sc = ["scanpy", "anndata", "leidenalg", "harmonypy"]
integration = ["harmonypy", "scvi-tools"]

[project.scripts]
biooptimize-rnaseq = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
