name: biooptimize-rnaseq
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - snakemake
  - multiqc
  - fastqc
  - star
  - hisat2
  - salmon
  - subread  # for featureCounts
  - samtools
  - r-base
  - r-deseq2
  - r-edger
  - r-tidyverse
  - pandas
  - numpy
  - pyyaml
  - click
  - rich
  - pip:
    - -e .
