name: biooptimize-rnaseq
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - snakemake
  - multiqc
  - fastqc
  - star
  - hisat2
  - salmon
  - subread  # for featureCounts
  - samtools
  - r-base
  - r-deseq2
  - r-edger
  - r-tidyverse
  # Single-cell
  - scanpy
  - anndata
  - leidenalg
  - python-igraph
  - umap-learn
  - harmonypy
  - pandas
  - numpy
  - pyyaml
  - click
  - rich
  - pip:
    - -e .
    # Optional deep integration:
    # - scvi-tools
